[package]
name = "personal"
version = "0.1.0"
description = "Personal Rust lints implemented with Dylint"
edition = "2024"
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0"

[dev-dependencies]
dylint_testing = "6.0"
